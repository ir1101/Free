[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automix"
version = "0.1.0"
description = "Auto-DJ: analyze, sequence and beat-match local music into a continuous mix"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.13",
    "librosa>=0.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# httpx2 is what starlette's TestClient drives the app through.
dev = ["pytest>=8.0", "httpx2"]

[project.scripts]
automix = "automix.cli:main"

[tool.setuptools.packages.find]
include = ["automix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
